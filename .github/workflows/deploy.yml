name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Sentry release
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_SECRET_KEY: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          echo "SENTRY_DSN=$SENTRY_DSN"
          echo "SENTRY_SECRET_KEY=$SENTRY_SECRET_KEY"

      - name: Build and deploy with Docker Compose
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_SECRET_KEY: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Create a .env file with the secrets that Docker Compose can use
          echo "SENTRY_DSN=$SENTRY_DSN" > .env
          echo "SENTRY_SECRET_KEY=$SENTRY_SECRET_KEY" >> .env

          # Run docker-compose to build and start the app
          docker-compose up --build -d
